# ==============================================================================
# Diana · nginx (proxy reverso)
# ==============================================================================
# Único punto de entrada HTTP/HTTPS del stack. NO publica postgres ni ningún
# puerto de administración: sólo expone frontend (panel) y backend (API +
# WebSocket) a través de rutas, con cabeceras de seguridad, límites de tamaño
# y rate limiting básico.
# ==============================================================================

user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rutas de trabajo escribibles por un usuario no root (imagen nginxinc/nginx-unprivileged)
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # --- Límites de tamaño ---------------------------------------------------
    client_max_body_size 5m;
    large_client_header_buffers 4 16k;

    # --- Rate limiting básico -------------------------------------------------
    # Zona para la API en general y otra más estricta para autenticación.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_general:10m;

    # --- Cabeceras de seguridad comunes ---------------------------------------
    map $sent_http_content_type $csp_header {
        default "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'";
    }

    server {
        listen 8080 default_server;
        server_name _;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy $csp_header always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # HSTS sólo tiene sentido detrás de TLS real; se activa en el vhost 443 (ver abajo).

        limit_conn conn_general 40;

        # --- API / WebSocket del backend -----------------------------------
        location /api/ {
            limit_req zone=api_general burst=40 nodelay;

            proxy_pass http://backend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/auth/ {
            limit_req zone=api_auth burst=10 nodelay;

            proxy_pass http://backend:3000/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- WebSocket (vista en directo) -----------------------------------
        location /ws/ {
            proxy_pass http://backend:3000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- Panel web (frontend) --------------------------------------------
        location / {
            limit_req zone=api_general burst=40 nodelay;

            proxy_pass http://frontend:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Healthcheck propio del proxy ------------------------------------
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ==========================================================================
    # HTTPS (PREPARADO, DESACTIVADO por defecto)
    # ==========================================================================
    # Para activar TLS en producción:
    #   1. Coloca certificado y clave en un volumen montado en /etc/nginx/certs
    #      (fuera de git; ver compose.yml, volumen `proxy_certs`).
    #   2. Descomenta el bloque siguiente y ajusta PROXY_HTTPS_PORT en .env.
    #   3. Considera forzar redirección 80->443 y añadir Strict-Transport-Security.
    #
    # server {
    #     listen 8443 ssl default_server;
    #     server_name _;
    #     ssl_certificate     /etc/nginx/certs/server.crt;
    #     ssl_certificate_key /etc/nginx/certs/server.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #     # ... mismas locations que el server 8080 ...
    # }
}
