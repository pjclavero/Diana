# ==============================================================================
# Diana · mosquitto.test.conf — broker efímero para el perfil `test`
# ==============================================================================
# Uso exclusivo de `docker compose --profile test`. NO es la configuración de
# producción (ver mosquitto.conf): aquí se permite anónimo y no hay ACL,
# porque el broker vive en tmpfs, no expone puertos al host y desaparece al
# terminar la ejecución de pruebas. Nunca reutilizar este fichero fuera del
# perfil `test`.
# ==============================================================================
persistence false

log_dest stdout
log_type warning
log_type error

allow_anonymous true

listener 1883
protocol mqtt
