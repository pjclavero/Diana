# ============================================================================
# Diana · configuración Eclipse Mosquitto
# ============================================================================
# Referencia normativa: contracts/mqtt/README.md sección 8 (Seguridad).
# - Sin acceso anónimo.
# - Un usuario por módulo + un usuario para el backend.
# - ACL estricta por tópico (ver ./acl).
# - Persistencia habilitada (retained + cola QoS 1/2).
# - Listener MQTT sobre TLS (8883) + listener WebSocket (9001) interno.
# - TLS obligatorio DESDE LA LAN: el 1883 en claro no se publica al host
#   (P0-2, hallazgo H7-03), que era el camino por el que se leían credenciales
#   del cable.
# - AVISO, y esta línea debe desaparecer con él: SIGUE EXISTIENDO un listener
#   1883 en claro, accesible dentro de la red interna de Docker. Es transitorio
#   (bloque del paso 10, más abajo) y se elimina en cuanto la celda 10 confirme
#   que el backend habla TLS de verdad. Mientras exista, una URL que vuelva a
#   `mqtt://` NO falla: conecta sin validar nada y en silencio. No afirmar en
#   ningún sitio que "no existe listener en claro" hasta que sea cierto.
# ============================================================================

# --- Identidad / logging -----------------------------------------------------
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# NOTA: la autenticación, la ACL y los límites son ajustes GLOBALES (con
# per_listener_settings en su valor por defecto `false`) y se declaran DESPUÉS
# del primer `listener`. Colocarlos antes hace que mosquitto 2.0 cree un
# «listener por defecto» EN CLARO en el puerto 1883 — que es justo lo que P0-2
# elimina. Ver el bloque tras el listener.

# ==============================================================================
# Listener 1 · MQTT sobre TLS (8883)
# Es el único puerto de mosquitto que se publica en el host (lo necesitan los
# módulos ESP32 físicos y el simulador). postgres y el resto del broker no se
# exponen fuera de la red interna de Docker.
#
# Éste es el único listener publicado al host. Sigue existiendo un 1883
# transitorio, alcanzable sólo dentro de la red de Docker (ver el bloque del
# paso 10, más abajo).
#
# Hasta 2026-08-10 el broker escuchaba en 1883 sin
# cifrar y era el único camino: MEDIDO (H7-03) que cualquiera con acceso a la
# LAN, sin credencial ninguna, leía el CONNECT y se llevaba usuario y
# contraseña de un módulo. La ACL y `use_username_as_clientid` defienden frente
# a un client_id falso, no frente a una credencial robada del cable.
# ==============================================================================
listener 8883
protocol mqtt

# --- Material TLS ------------------------------------------------------------
# Generado por infrastructure/mosquitto/generate-certs.sh y montado de sólo
# lectura en /mosquitto/certs (fuera de git; ver .gitignore).
#   cafile   la CA propia: el cliente la usa para validar a ESTE servidor.
#   certfile cadena del servidor; su SAN incluye `mosquitto`, `localhost`,
#            127.0.0.1 y la IP de la LAN — un nombre ausente hace fallar la
#            conexión, no la degrada.
#   keyfile  clave privada del broker (0600, nunca en el repositorio).
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# TLS de servidor solamente: el cliente valida al broker, y la identidad del
# cliente sigue siendo la de MQTT (usuario/contraseña + ACL), que ya está
# endurecida. Pasar a certificados de cliente (mTLS) cambiaría el modelo de
# identidad y es una frontera distinta: fuera de P0-2 deliberadamente.
require_certificate false
tls_version tlsv1.2
# Fuerza IPv4 (la red interna de Docker es IPv4); evita además el bind IPv6
# dual-stack. Ídem en el listener de WebSockets.
socket_domain ipv4

# --- Autenticación, ACL y límites (GLOBALES) ---------------------------------
# Declarados aquí, tras el primer listener, para no crear un listener por
# defecto en 1883. Nunca acceso anónimo: todo cliente (módulos y backend) se
# autentica con usuario/contraseña generados por generate-users.sh.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# F-02 (crítico): sin esto, la ACL (patrón %c) autoriza por el client_id que
# el propio cliente declara en el CONNECT, no por el usuario autenticado —
# con las credenciales de un módulo cualquiera y client_id de otro módulo se
# suplantaba a ese otro módulo (confirmado en vivo el 2026-07-21, ver
# docs/security/findings.md F-02). Esta directiva hace que el broker
# REESCRIBA el client_id del cliente con su usuario autenticado antes de
# evaluar la ACL, así que el cliente deja de poder elegirlo. Requiere que el
# usuario mosquitto de cada módulo sea EXACTAMENTE su module_id, sin prefijo
# (ver infrastructure/mosquitto/acl y generate-users.sh) — si algún día un
# usuario mosquitto necesitara client_id distinto de su module_id, esta
# directiva rompería esa conexión; hoy no existe ese caso.
use_username_as_clientid true
max_connections 64
max_queued_messages 1000
message_size_limit 262144
persistent_client_expiration 7d

# El bloque "TLS preparado pero comentado" que vivía aquí se ha eliminado: el
# TLS ya está activo arriba, y dejar una receta alternativa comentada invita a
# reabrir un listener en claro por error.

# ==============================================================================
# TRANSITORIO P0-2 (paso 4→10) · listener MQTT en claro, SOLO RED INTERNA
# ------------------------------------------------------------------------------
# ESTE BLOQUE SE ELIMINA EN EL PASO 10. NO se publica en el host (ver
# compose.yml: sólo se mapea 8883), así que desde la LAN el camino en claro ya
# no existe.
#
# CORRECCIÓN (el motivo escrito aquí antes era falso): decía existir "para que
# el backend y el worker sigan funcionando". Ya no es cierto de ninguno de los
# dos — el backend habla mqtts://…:8883 y el worker no es cliente MQTT en
# absoluto, se le retiró toda credencial y configuración. El motivo REAL, y el
# único, es que ./test-acl.sh —la herramienta con la que se verifica la ACL en
# las celdas 10-16— no sabe hablar TLS: no acepta --cafile en ninguna de sus
# invocaciones y su uso documentado es `./test-acl.sh 127.0.0.1 1883`.
#
# Por tanto la condición para cerrar este listener no es "que pase la celda
# 10": es dotar de TLS a test-acl.sh. Mientras el motivo real siga sin estar
# escrito, alguien lo conservará por la razón equivocada.
# ==============================================================================
listener 1883
protocol mqtt
socket_domain ipv4

# ==============================================================================
# Listener 2 · WebSockets (9001)
# Uso interno: el backend/frontend pueden consumir MQTT por WS a través del
# proxy si se necesita en el panel. No es imprescindible para los módulos.
# ==============================================================================
listener 9001
protocol websockets
socket_domain ipv4

# --- TLS para WebSockets (PREPARADO, DESACTIVADO) ----------------------------
# Mismo procedimiento que arriba; en producción exponer wss:// sólo detrás del
# proxy nginx con terminación TLS, no directamente.
# listener 9001
# protocol websockets
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
