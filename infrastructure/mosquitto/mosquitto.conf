# ============================================================================
# Diana · configuración Eclipse Mosquitto
# ============================================================================
# Referencia normativa: contracts/mqtt/README.md sección 8 (Seguridad).
# - Sin acceso anónimo.
# - Un usuario por módulo + un usuario para el backend.
# - ACL estricta por tópico (ver ./acl).
# - Persistencia habilitada (retained + cola QoS 1/2).
# - Listener MQTT sobre TLS (8883) + listener MQTT en claro (1883, PERFIL DE
#   TRANSICIÓN, ver más abajo) + listener WebSocket (9001) para el panel.
#
# ESTADO DE ESTE FICHERO: `TLS_WIRED_NOT_EXCLUSIVE` (P0-2, carril D1).
#   El 8883 con TLS está CABLEADO y es el camino recomendado. El 1883 en claro
#   NO se ha retirado todavía y CONVIVE con él a propósito. No escribir en
#   ningún sitio que «el broker es TLS-only»: hoy es falso, y decirlo sería
#   exactamente la afirmación de más que este carril existe para no repetir.
#
# CONDICIÓN DE RETIRADA DEL 1883 (paso 16 del orden de porteo, decisión D1 del
# operador — docs/coordination/P02-RECONCILIACION.md §5):
#   el firmware vigente lleva `mqtt://%s:1883` CABLEADO y no puede hablar 8883.
#   Retirar el listener en claro deja a todo módulo ESP32 físico fuera de
#   servicio. Se retira cuando (a) exista el carril de TLS de firmware y esté
#   validado sobre hardware real, o (b) el operador acepte por escrito dejar
#   los módulos físicos fuera. Ninguna de las dos se ha cumplido a fecha de hoy.
#
# DEUDA QUE NO SE CIERRA AQUÍ: el `listener 9001` (WebSockets) sigue EN CLARO
# dentro de la red interna, con el mismo password_file y la misma ACL. WSS está
# fuera del alcance de P0-2 (decisión D4). La afirmación cierta y defendible
# tras este porte NO es «no queda ningún camino en claro».
# ============================================================================

# --- Identidad / logging -----------------------------------------------------
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# NOTA: la autenticación, la ACL y los límites son ajustes GLOBALES (con
# per_listener_settings en su valor por defecto `false`) y se declaran DESPUÉS
# del primer `listener`. Colocarlos antes hace que mosquitto 2.0 cree un
# «listener por defecto» en el puerto 1883, que luego choca con `listener 1883`
# y aborta con «Error: Address in use». Ver el bloque tras el listener.

# ==============================================================================
# Listener 1 · MQTT sobre TLS (8883) — el camino recomendado
#
# Hasta este porte el broker sólo escuchaba en 1883 sin cifrar, y era el único
# camino: MEDIDO (hallazgo H7-03) que cualquiera con acceso a la LAN, sin
# credencial ninguna, leía el CONNECT y se llevaba usuario y contraseña de un
# módulo. La ACL y `use_username_as_clientid` defienden frente a un client_id
# falso, no frente a una credencial robada del cable.
#
# Va PRIMERO también por una razón mecánica: los ajustes globales
# (allow_anonymous, password_file, acl_file, límites) tienen que declararse
# después del primer `listener`, o mosquitto 2.0 crea un «listener por defecto»
# EN CLARO en 1883 que además choca con el nuestro y aborta con
# «Error: Address in use».
# ==============================================================================
listener 8883
protocol mqtt

# --- Material TLS ------------------------------------------------------------
# Generado por infrastructure/mosquitto/generate-certs.sh y montado de sólo
# lectura en /mosquitto/certs (fuera de git; ver .gitignore).
#   cafile   la CA propia: el cliente la usa para validar a ESTE servidor.
#   certfile cadena del servidor; su SAN incluye `mosquitto`, `localhost`,
#            127.0.0.1 y la IP de la LAN — un nombre ausente hace fallar la
#            conexión, no la degrada.
#   keyfile  clave privada del broker (0600, propiedad del uid 1883 con el que
#            corre la imagen oficial; si no puede leerla, el broker NO arranca).
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# TLS de servidor solamente: el cliente valida al broker, y la identidad del
# cliente sigue siendo la de MQTT (usuario/contraseña + ACL), que ya está
# endurecida por F-02. Pasar a certificados de cliente (mTLS) cambiaría el
# modelo de identidad y es una frontera distinta: fuera de P0-2 deliberadamente.
require_certificate false
tls_version tlsv1.2

# Fuerza IPv4 (la red interna de Docker es IPv4); evita además el bind IPv6
# dual-stack. Ídem en los demás listeners.
socket_domain ipv4

# --- Autenticación, ACL y límites (GLOBALES) ---------------------------------
# Declarados aquí, tras el primer listener, para no crear un listener por
# defecto en 1883. Nunca acceso anónimo: todo cliente (módulos y backend) se
# autentica con usuario/contraseña generados por generate-users.sh.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# F-02 (crítico): sin esto, la ACL (patrón %c) autoriza por el client_id que
# el propio cliente declara en el CONNECT, no por el usuario autenticado —
# con las credenciales de un módulo cualquiera y client_id de otro módulo se
# suplantaba a ese otro módulo (confirmado en vivo el 2026-07-21, ver
# docs/security/findings.md F-02). Esta directiva hace que el broker
# REESCRIBA el client_id del cliente con su usuario autenticado antes de
# evaluar la ACL, así que el cliente deja de poder elegirlo. Requiere que el
# usuario mosquitto de cada módulo sea EXACTAMENTE su module_id, sin prefijo
# (ver infrastructure/mosquitto/acl y generate-users.sh) — si algún día un
# usuario mosquitto necesitara client_id distinto de su module_id, esta
# directiva rompería esa conexión; hoy no existe ese caso.
use_username_as_clientid true
max_connections 64
max_queued_messages 1000
message_size_limit 262144
persistent_client_expiration 7d

# La receta «TLS preparado pero comentado» que vivía aquí se ha ELIMINADO: el
# TLS ya está activo arriba, y dejar una receta alternativa comentada invita a
# reabrir un listener en claro por error.

# ==============================================================================
# Listener 2 · MQTT EN CLARO (1883) — PERFIL DE TRANSICIÓN, CON FECHA DE MUERTE
#
# ESTO ES DEUDA, NO DISEÑO. Sobrevive por UNA sola razón, escrita y
# comprobable: el firmware vigente lleva `mqtt://%s:1883` CABLEADO
# (firmware/esp32) y no sabe hablar TLS. Mientras ese carril no exista y no se
# valide sobre hardware real, retirar este listener deja a los módulos físicos
# sin servicio.
#
# Lo que NO es una razón para conservarlo, aunque lo parezca:
#   - «el backend lo necesita»    → FALSO: el backend habla mqtts://…:8883.
#   - «el worker lo necesita»     → FALSO: el worker no es cliente MQTT.
#   - «para depurar»              → NO. Si hace falta un broker en claro,
#                                    levántalo aparte y aislado (perfil `test`,
#                                    red `testnet`, mosquitto.test.conf).
#
# RETIRADA: paso 16 del orden de porteo, atado a la decisión D1 del operador.
# Al retirarlo hay que borrar A LA VEZ este bloque, la publicación del 1883 en
# compose.yml y compose.dev.yml, y la regla del 1883 en
# infrastructure/network/04-firewall.sh. La regresión que lo vigila
# —broker-sin-listener-en-claro.spec.ts— está DELIBERADAMENTE fuera del árbol
# mientras este listener exista: se pondría roja por diseño, y un test rojo
# permanente se acaba desactivando.
#
# Mientras viva, cualquier credencial que viaje por este puerto debe
# considerarse comprometida en cuanto alguien tenga acceso a la LAN.
# ==============================================================================
listener 1883
protocol mqtt
socket_domain ipv4

# --- F-02, barrera 1 · TAMBIÉN AQUÍ ------------------------------------------
# `use_username_as_clientid` es POR LISTENER y NO la gobierna
# `per_listener_settings`. Declararla una sola vez tras el primer listener la
# dejaría activa SÓLO allí, y este listener quedaría sin la barrera 1 de F-02.
use_username_as_clientid true

# ==============================================================================
# Listener 3 · WebSockets (9001) — EN CLARO, deuda declarada (D4)
# Uso interno: el backend/frontend pueden consumir MQTT por WS a través del
# proxy si se necesita en el panel. No es imprescindible para los módulos.
# ==============================================================================
listener 9001
protocol websockets
socket_domain ipv4

# --- F-02, barrera 1 · TAMBIÉN AQUÍ -----------------------------------------
# `use_username_as_clientid` es POR LISTENER y NO la gobierna
# `per_listener_settings`. Declararla una sola vez tras `listener 1883` la deja
# activa SÓLO en 1883: este listener quedaba sin ella, y con él la barrera 1 de
# F-02 ausente en WebSockets.
#
# La barrera 2 (esta ACL no usa %c ni %u y nombra el module_id literal) cubre el
# hueco por sí sola — demostrado contra un broker gemelo sin esta directiva, ver
# docs/security/evidence/mp0-laboratorio-aislado.md. Pero Diana usa defensa en
# profundidad: saber que falta una de las dos barreras y dejarla así no procede.
#
# La regresión que lo vigila comprueba la propiedad POR LISTENER, no que la
# palabra aparezca en el fichero: ver simulators/test/listener-identity-binding.test.ts
use_username_as_clientid true

# --- TLS para WebSockets (PREPARADO, DESACTIVADO) ----------------------------
# Mismo procedimiento que arriba; en producción exponer wss:// sólo detrás del
# proxy nginx con terminación TLS, no directamente.
# listener 9001
# protocol websockets
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
