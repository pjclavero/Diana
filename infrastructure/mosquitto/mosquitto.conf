# ============================================================================
# Diana · configuración Eclipse Mosquitto
# ============================================================================
# Referencia normativa: contracts/mqtt/README.md sección 8 (Seguridad).
# - Sin acceso anónimo.
# - Un usuario por módulo + un usuario para el backend.
# - ACL estricta por tópico (ver ./acl).
# - Persistencia habilitada (retained + cola QoS 1/2).
# - Listener MQTT sobre TLS (8883) — ÚNICO listener MQTT/TCP — + listener
#   WebSocket (9001) para el panel.
# - NO EXISTE ningún listener MQTT/TCP en claro. Ni publicado al host ni dentro
#   de la red interna de Docker (P0-2, hallazgo H7-03: el 1883 era el camino
#   por el que se leían credenciales del cable).
#
# ESTADO DE ESTE FICHERO: `TLS_EXCLUSIVE_MQTT` (P0-2 cerrado en el repositorio).
#   Esta afirmación es COMPROBABLE, no una nota: la vigila
#   server/backend/test/mqtt/broker-sin-listener-en-claro.spec.ts, que se pone
#   ROJA si alguien reintroduce un `listener` sin material TLS aquí, o vuelve a
#   publicar el 1883 en compose.yml o compose.dev.yml. Los puertos se comprueban
#   PARSEANDO EL YAML, no con una expresión regular por línea, y un campo de
#   puerto no interpretable LANZA en vez de ignorarse en silencio.
#
# POR QUÉ SE PUEDE CERRAR AHORA, y no antes. El listener en claro sobrevivía
# atado a la decisión D1 del operador (docs/coordination/P02-RECONCILIACION.md
# §5), cuya premisa era: «el firmware vigente lleva `mqtt://%s:1883` CABLEADO y
# no puede hablar 8883; retirarlo deja a todo módulo ESP32 físico fuera de
# servicio». ESA PREMISA YA NO ES CIERTA y está desmentida por escrito en
# docs/coordination/C-PREPARACION-BANCO.md §«mitos»: `app_main.c` construye la
# URI con `diana_mqtt_uri(...)`, el esquema por defecto es `mqtts://` y el
# puerto por defecto 8883. El hecho que cierra D1 es físico, no documental: el
# módulo `module-01` real conecta hoy contra `mqtts://192.168.1.209:8883`
# validando CA y nombre de servidor, y está ONLINE. Desaparecida la razón,
# desaparece el listener.
#
# NO REABRIR para depurar. Si hace falta un broker en claro, levántalo aparte y
# AISLADO: `infrastructure/mosquitto/mosquitto.test.conf` sobre el servicio
# `mosquitto-test` del perfil `test`, en la red `testnet`, que no toca la red de
# producción. Eso es legítimo; reabrir este fichero no.
#
# DEUDA QUE NO SE CIERRA AQUÍ: el `listener 9001` (WebSockets) sigue EN CLARO
# dentro de la red interna, con el mismo password_file y la misma ACL. WSS está
# fuera del alcance de P0-2 (decisión D4). La afirmación cierta y defendible
# tras este cierre es «no queda ningún camino MQTT/TCP en claro», NO «no queda
# ningún camino en claro» a secas.
# ============================================================================

# --- Identidad / logging -----------------------------------------------------
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# NOTA: la autenticación, la ACL y los límites son ajustes GLOBALES (con
# per_listener_settings en su valor por defecto `false`) y se declaran DESPUÉS
# del primer `listener`. Colocarlos antes hace que mosquitto 2.0 cree un
# «listener por defecto» EN CLARO en el puerto 1883 — que es justo lo que este
# fichero elimina. Ver el bloque tras el listener.

# ==============================================================================
# Listener 1 · MQTT sobre TLS (8883) — el ÚNICO listener MQTT del broker
#
# Es también el único puerto de mosquitto que se publica en el host: lo
# necesitan los módulos ESP32 físicos y el simulador. No hay ningún otro puerto
# MQTT, ni publicado ni interno. (El 9001 de más abajo es WebSockets.)
#
# Hasta este cierre el broker también escuchaba en 1883 sin cifrar, y era el único
# camino: MEDIDO (hallazgo H7-03) que cualquiera con acceso a la LAN, sin
# credencial ninguna, leía el CONNECT y se llevaba usuario y contraseña de un
# módulo. La ACL y `use_username_as_clientid` defienden frente a un client_id
# falso, no frente a una credencial robada del cable.
#
# Va PRIMERO también por una razón mecánica: los ajustes globales
# (allow_anonymous, password_file, acl_file, límites) tienen que declararse
# después del primer `listener`, o mosquitto 2.0 crea un «listener por defecto»
# EN CLARO en 1883 que además choca con el nuestro y aborta con
# «Error: Address in use».
# ==============================================================================
listener 8883
protocol mqtt

# --- Material TLS ------------------------------------------------------------
# Generado por infrastructure/mosquitto/generate-certs.sh y montado de sólo
# lectura en /mosquitto/certs (fuera de git; ver .gitignore).
#   cafile   la CA propia: el cliente la usa para validar a ESTE servidor.
#   certfile cadena del servidor; su SAN incluye `mosquitto`, `localhost`,
#            127.0.0.1 y la IP de la LAN — un nombre ausente hace fallar la
#            conexión, no la degrada.
#   keyfile  clave privada del broker (0600, propiedad del uid 1883 con el que
#            corre la imagen oficial; si no puede leerla, el broker NO arranca).
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# TLS de servidor solamente: el cliente valida al broker, y la identidad del
# cliente sigue siendo la de MQTT (usuario/contraseña + ACL), que ya está
# endurecida por F-02. Pasar a certificados de cliente (mTLS) cambiaría el
# modelo de identidad y es una frontera distinta: fuera de P0-2 deliberadamente.
require_certificate false
tls_version tlsv1.2

# Fuerza IPv4 (la red interna de Docker es IPv4); evita además el bind IPv6
# dual-stack. Ídem en los demás listeners.
socket_domain ipv4

# --- Autenticación, ACL y límites (GLOBALES) ---------------------------------
# Declarados aquí, tras el primer listener, para no crear un listener por
# defecto en 1883. Nunca acceso anónimo: todo cliente (módulos y backend) se
# autentica con usuario/contraseña generados por generate-users.sh.
allow_anonymous false
# El fichero de credenciales vive en un DIRECTORIO propio, montado desde un
# volumen compartido con el backend, y no junto al resto de la configuracion.
# Dos razones, y ninguna es estetica:
#
#  1. El backend ES la autoridad de credenciales y tiene que poder escribir
#     aqui. El resto de /mosquitto/config se monta en solo lectura y debe
#     seguir asi: la ACL y esta misma configuracion no las toca nadie en
#     caliente.
#  2. `mosquitto_passwd` reescribe el fichero entero y lo RENOMBRA encima. Un
#     bind mount de un FICHERO suelto ata el contenedor a un inodo: tras el
#     renombrado el broker seguiria leyendo el inodo viejo y no veria ni una
#     sola credencial nueva, sin ningun error. Montando el directorio, el
#     renombrado se ve.
#
# Tras cada escritura hace falta SIGHUP: mosquitto no relee este fichero solo.
# Lo manda `reload-on-passwd-change.sh`, que corre en este mismo contenedor.
password_file /mosquitto/credentials/passwd
acl_file /mosquitto/config/acl
# F-02 (crítico): sin esto, la ACL (patrón %c) autoriza por el client_id que
# el propio cliente declara en el CONNECT, no por el usuario autenticado —
# con las credenciales de un módulo cualquiera y client_id de otro módulo se
# suplantaba a ese otro módulo (confirmado en vivo el 2026-07-21, ver
# docs/security/findings.md F-02). Esta directiva hace que el broker
# REESCRIBA el client_id del cliente con su usuario autenticado antes de
# evaluar la ACL, así que el cliente deja de poder elegirlo. Requiere que el
# usuario mosquitto de cada módulo sea EXACTAMENTE su module_id, sin prefijo
# (ver infrastructure/mosquitto/acl y generate-users.sh) — si algún día un
# usuario mosquitto necesitara client_id distinto de su module_id, esta
# directiva rompería esa conexión; hoy no existe ese caso.
use_username_as_clientid true
max_connections 64
max_queued_messages 1000
message_size_limit 262144
persistent_client_expiration 7d

# La receta «TLS preparado pero comentado» que vivía aquí se ha ELIMINADO: el
# TLS ya está activo arriba, y dejar una receta alternativa comentada invita a
# reabrir un listener en claro por error.

# ==============================================================================
# AQUÍ VIVÍA EL `listener 1883` EN CLARO. Eliminado al cerrar P0-2 en el repo.
# ------------------------------------------------------------------------------
# Se conservó como «perfil de transición» con una única justificación escrita:
# que el firmware físico llevaba `mqtt://%s:1883` cableado y no sabía hablar
# TLS. Ese motivo ya no existe (ver la cabecera de este fichero): el firmware
# construye la URI con esquema `mqtts://` y puerto 8883 por defecto, y el módulo
# físico `module-01` conecta por `mqtts://192.168.1.209:8883` validando CA y
# nombre. Con la premisa cae la excepción.
#
# Lo que NO es una razón para reabrirlo, aunque lo parezca:
#   - «el backend lo necesita»    → FALSO: el backend habla mqtts://mosquitto:8883
#                                    (compose.yml fija MQTT_PORT=8883 y
#                                    MQTT_PROTOCOL=mqtts, y mqtt.service.ts
#                                    RECHAZA un esquema en claro).
#   - «el worker lo necesita»     → FALSO: el worker no es cliente MQTT.
#   - «test-acl.sh lo necesita»   → FALSO: habla TLS contra el 8883 con
#                                    MQTT_CAFILE desde hace varias rondas.
#   - «el healthcheck lo usa»     → FALSO: sondea el 8883 validando la CA, a
#                                    propósito, para que un TLS roto no pase.
#   - «para depurar»              → NO. Levanta un broker aparte y aislado:
#                                    perfil `test`, red `testnet`,
#                                    mosquitto.test.conf.
#
# Al cerrarlo se retiraron A LA VEZ: este bloque, la publicación del 1883 en
# compose.yml, y la regla del 1883 en infrastructure/provisioning/04-firewall.sh.
# La regresión que lo vigila —broker-sin-listener-en-claro.spec.ts— ya NO está
# fuera del árbol: está dentro y en verde, y se pone roja si esto vuelve.
# ==============================================================================

# ==============================================================================
# Listener 3 · WebSockets (9001) — EN CLARO, deuda declarada (D4)
# Uso interno: el backend/frontend pueden consumir MQTT por WS a través del
# proxy si se necesita en el panel. No es imprescindible para los módulos.
# ==============================================================================
listener 9001
protocol websockets
socket_domain ipv4

# --- F-02, barrera 1 · TAMBIÉN AQUÍ -----------------------------------------
# `use_username_as_clientid` es POR LISTENER y NO la gobierna
# `per_listener_settings`. Declararla una sola vez tras el primer `listener` la
# deja activa SÓLO allí: este listener quedaría sin ella, y con él la barrera 1
# de F-02 ausente en WebSockets.
#
# La barrera 2 (esta ACL no usa %c ni %u y nombra el module_id literal) cubre el
# hueco por sí sola — demostrado contra un broker gemelo sin esta directiva, ver
# docs/security/evidence/mp0-laboratorio-aislado.md. Pero Diana usa defensa en
# profundidad: saber que falta una de las dos barreras y dejarla así no procede.
#
# La regresión que lo vigila comprueba la propiedad POR LISTENER, no que la
# palabra aparezca en el fichero: ver simulators/test/listener-identity-binding.test.ts
use_username_as_clientid true

# --- TLS para WebSockets (PREPARADO, DESACTIVADO) ----------------------------
# Mismo procedimiento que arriba; en producción exponer wss:// sólo detrás del
# proxy nginx con terminación TLS, no directamente.
# listener 9001
# protocol websockets
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
