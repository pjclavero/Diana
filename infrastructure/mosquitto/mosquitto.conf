# ============================================================================
# Diana · configuración Eclipse Mosquitto
# ============================================================================
# Referencia normativa: contracts/mqtt/README.md sección 8 (Seguridad).
# - Sin acceso anónimo.
# - Un usuario por módulo + un usuario para el backend.
# - ACL estricta por tópico (ver ./acl).
# - Persistencia habilitada (retained + cola QoS 1/2).
# - Listener MQTT estándar (1883) + listener WebSocket (9001) para el panel.
# - TLS preparado pero comentado: se activa en producción real (dosier §23.1).
# ============================================================================

# --- Identidad / logging -----------------------------------------------------
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# NOTA: la autenticación, la ACL y los límites son ajustes GLOBALES (con
# per_listener_settings en su valor por defecto `false`) y se declaran DESPUÉS
# del primer `listener`. Colocarlos antes hace que mosquitto 2.0 cree un
# «listener por defecto» en el puerto 1883, que luego choca con `listener 1883`
# y aborta con «Error: Address in use». Ver el bloque tras el listener.

# ==============================================================================
# Listener 1 · MQTT estándar (1883)
# Es el único puerto de mosquitto que se publica en el host (lo necesitan los
# módulos ESP32 físicos y el simulador). postgres y el resto del broker no se
# exponen fuera de la red interna de Docker.
# ==============================================================================
listener 1883
protocol mqtt
# Fuerza IPv4 (la red interna de Docker es IPv4); evita además el bind IPv6
# dual-stack. Ídem en el listener de WebSockets.
socket_domain ipv4

# --- Autenticación, ACL y límites (GLOBALES) ---------------------------------
# Declarados aquí, tras el primer listener, para no crear un listener por
# defecto en 1883. Nunca acceso anónimo: todo cliente (módulos y backend) se
# autentica con usuario/contraseña generados por generate-users.sh.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# F-02 (crítico): sin esto, la ACL (patrón %c) autoriza por el client_id que
# el propio cliente declara en el CONNECT, no por el usuario autenticado —
# con las credenciales de un módulo cualquiera y client_id de otro módulo se
# suplantaba a ese otro módulo (confirmado en vivo el 2026-07-21, ver
# docs/security/findings.md F-02). Esta directiva hace que el broker
# REESCRIBA el client_id del cliente con su usuario autenticado antes de
# evaluar la ACL, así que el cliente deja de poder elegirlo. Requiere que el
# usuario mosquitto de cada módulo sea EXACTAMENTE su module_id, sin prefijo
# (ver infrastructure/mosquitto/acl y generate-users.sh) — si algún día un
# usuario mosquitto necesitara client_id distinto de su module_id, esta
# directiva rompería esa conexión; hoy no existe ese caso.
use_username_as_clientid true
max_connections 64
max_queued_messages 1000
message_size_limit 262144
persistent_client_expiration 7d

# --- TLS para el listener 1883 (PREPARADO, DESACTIVADO) ---------------------
# Para activarlo en producción (dosier §23.1: "TLS en producción"):
#   1. Genera/obtén certificados (CA propia o Let's Encrypt con DNS interno).
#   2. Copia cafile/certfile/keyfile dentro del volumen infrastructure/mosquitto/certs/
#      (montado en /mosquitto/certs, fuera de git).
#   3. Descomenta las líneas siguientes y comenta "protocol mqtt" de arriba si
#      quieres forzar TLS-only en el mismo puerto, o abre un listener 8883 nuevo.
#   4. Reinicia el contenedor mosquitto.
#
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate false
# tls_version tlsv1.2

# ==============================================================================
# Listener 2 · WebSockets (9001)
# Uso interno: el backend/frontend pueden consumir MQTT por WS a través del
# proxy si se necesita en el panel. No es imprescindible para los módulos.
# ==============================================================================
listener 9001
protocol websockets
socket_domain ipv4

# --- F-02, barrera 1 · TAMBIÉN AQUÍ -----------------------------------------
# `use_username_as_clientid` es POR LISTENER y NO la gobierna
# `per_listener_settings`. Declararla una sola vez tras `listener 1883` la deja
# activa SÓLO en 1883: este listener quedaba sin ella, y con él la barrera 1 de
# F-02 ausente en WebSockets.
#
# La barrera 2 (esta ACL no usa %c ni %u y nombra el module_id literal) cubre el
# hueco por sí sola — demostrado contra un broker gemelo sin esta directiva, ver
# docs/security/evidence/mp0-laboratorio-aislado.md. Pero Diana usa defensa en
# profundidad: saber que falta una de las dos barreras y dejarla así no procede.
#
# La regresión que lo vigila comprueba la propiedad POR LISTENER, no que la
# palabra aparezca en el fichero: ver simulators/test/listener-identity-binding.test.ts
use_username_as_clientid true

# --- TLS para WebSockets (PREPARADO, DESACTIVADO) ----------------------------
# Mismo procedimiento que arriba; en producción exponer wss:// sólo detrás del
# proxy nginx con terminación TLS, no directamente.
# listener 9001
# protocol websockets
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
