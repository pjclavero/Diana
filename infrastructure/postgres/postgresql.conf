# ==============================================================================
# Diana · tuning modesto de PostgreSQL para VM de 4 vCPU / 4 GB RAM
# ==============================================================================
# Objetivo: valores conservadores y seguros, no un ajuste fino. Diana no tiene
# cargas de escritura masivas (impactos MQTT y consultas de panel), así que se
# prioriza estabilidad de memoria sobre rendimiento máximo.
# Referencia: dosier §26 (requisitos del servidor: 2-4 vCPU / 4-8 GB recomendado).
# ==============================================================================

# --- Conexiones ---------------------------------------------------------------
# Con un config_file propio, si no se declara listen_addresses PostgreSQL usa el
# valor por defecto 'localhost': el contenedor escucharía sólo en 127.0.0.1 y el
# healthcheck (pg_isready local) pasaría, pero backend, worker y migrate —en la
# red interna de Docker— reciben P1001 «Can't reach database server». Se escucha
# en todas las interfaces; la exposición sigue acotada por no publicar el puerto
# al host (compose) y por pg_hba.conf.
listen_addresses = '*'

# --- Zona horaria: todo el sistema opera en UTC (contracts/mqtt §4) ---------
timezone = 'UTC'
log_timezone = 'UTC'

# --- Memoria (conservador para 4 GB totales de VM, compartidos con el resto
#     de contenedores del stack) -----------------------------------------------
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB

# --- Conexiones ----------------------------------------------------------------
max_connections = 50

# --- WAL / checkpoints (favorece recuperación fiable sobre throughput) -------
wal_level = replica
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_completion_target = 0.9

# --- Planificador: SSD asumido (VM sobre almacenamiento Proxmox) -------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Logging mínimo útil sin ruido excesivo -----------------------------------
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# --- Autovacuum activo (por defecto, explícito para claridad) ----------------
autovacuum = on
