# ==============================================================================
# Diana · compose.yml — stack de producción/base
# ==============================================================================
# WP-01 (infraestructura Docker). Ver docs/coordination/WORK_PACKAGES.md.
#
# IMPORTANTE — dependencias de otros paquetes en curso:
#   Los contextos de build server/backend, server/frontend, server/worker y
#   simulators/target-module los rellenan WP-02, WP-03 y WP-05 en paralelo.
#   Hoy están vacíos. Este fichero referencia sus rutas correctas y sus
#   Dockerfile esperados (server/backend/Dockerfile, etc.) pero NO los crea:
#   `docker compose config` valida sintaxis/interpolación sin necesitar que
#   existan; `docker compose build`/`up` SÍ los necesitará y no es tarea de
#   WP-01 (lo ejecuta WP-08 en la VM, una vez todos los paquetes converjan).
#
# Perfiles:
#   (sin perfil)  → stack completo de producción/desarrollo base: proxy,
#                   frontend, backend, worker, postgres, mosquitto, migrate,
#                   backup.
#   simulator     → añade `device-simulator` (simulators/target-module).
#   dev           → añade `seed` (datos de prueba). Combinar con
#                   compose.dev.yml para puertos de depuración y bind mounts.
#   test          → añade postgres-test/mosquitto-test (efímeros) y
#                   test-runner (contracts/validate.py y suites de pruebas).
#   monitoring    → añade `cadvisor` (ver infrastructure/monitoring/README.md).
#
# Recursos: la VM destino tiene 4 vCPU / 4 GB. Los límites de abajo sólo
# reservan según necesidad real y dejan margen (ver informe final del agente
# para el desglose de la suma).
# ==============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------------------------
  # Proxy (nginx) — único punto de entrada HTTP/HTTPS
  # ----------------------------------------------------------------------------
  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${PROXY_HTTP_PORT:-8080}:8080"
      # HTTPS preparado y desactivado por defecto (ver infrastructure/proxy/nginx.conf).
      # - "${PROXY_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./infrastructure/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - proxy_certs:/etc/nginx/certs:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # Frontend (React + Vite, servido por su propio servidor estático)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./server/frontend
      dockerfile: Dockerfile
      args:
        # `mock` por defecto A PROPÓSITO, y hay que saberlo: con este valor el
        # panel NO habla con el backend, sirve datos de demostración. Pasar a
        # `real` exige antes cerrar X-21 (las pantallas heredadas siguen en
        # datos de demostración y fallarían contra el backend real).
        VITE_API_MODE: ${VITE_API_MODE:-mock}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
    image: diana/frontend:local
    restart: unless-stopped
    environment:
      # OJO: las VITE_* son de COMPILACIÓN, no de ejecución. Ponerlas aquí no
      # tiene ningún efecto sobre un bundle ya construido; van en `build.args`.
      # Además el código lee `VITE_WS_URL`, no `VITE_WS_BASE_URL`: el nombre de
      # aquí no casaba con ninguna variable del panel y no hacía nada.
      NODE_ENV: ${NODE_ENV:-production}
    networks:
      - edge
    healthcheck:
      # ⚠ COORDINACIÓN PENDIENTE (WP-03): se asume un endpoint /health servido
      # por el propio contenedor frontend (convención habitual de servidor
      # estático/Vite). No confirmado contra código real de server/frontend
      # (el contexto está vacío al escribir esto). Si WP-03 usa otra ruta o
      # puerto, este test debe ajustarse antes de integrar las ramas.
      # VERIFICADO (WP-08): el contenedor frontend (nginx-unprivileged) sirve
      # en el puerto 8080 (server/frontend/nginx.conf: listen 8080), no 8081.
      # El fallback try_files a index.html devuelve 200 para /health.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # Backend (NestJS: API REST + WebSocket + ingesta MQTT)
  # ----------------------------------------------------------------------------
  backend:
    build:
      # Contexto en la RAÍZ del repo: la imagen necesita contracts/ (ver
      # server/backend/Dockerfile, hallazgo F-13).
      context: .
      dockerfile: server/backend/Dockerfile
    image: diana/backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      # Puerto INTERNO del broker, FIJO y sin variable. Antes era
      # ${MQTT_PORT:-1883}, que es tambien el puerto PUBLICADO AL HOST: cambiar
      # la publicacion --- algo que un operador hace sin pensar si el puerto le
      # choca con otra cosa --- rompia la conexion del backend, que habla con
      # `mosquitto:8883` DENTRO de la red. Configuracion que aparenta gobernar
      # algo que no gobierna.
      MQTT_PORT: 8883
      MQTT_PROTOCOL: mqtts
      # La CA propia con la que el backend valida al broker. Se monta SOLO el
      # certificado publico: la clave de la CA no entra en este contenedor.
      #
      # PRERREQUISITO DE DESPLIEGUE (riesgo R3 del inventario): este fichero
      # tiene que existir ANTES del primer `up`. Sin el, el backend falla
      # cerrado en el arranque y entra en bucle de reinicio --- que es el
      # comportamiento correcto, no un fallo. Ejecutar antes:
      #   ./infrastructure/mosquitto/generate-certs.sh
      MQTT_CA_FILE: /app/certs/mqtt-ca.crt
      MQTT_USERNAME: ${MQTT_BACKEND_USERNAME:-backend}
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      # El backend lee JWT_SECRET (configuration.ts:48) y ABORTA en producción
      # si falta. Antes no se pasaba: el backend no arrancaba (fix de contrato
      # de entorno, WP-10).
      JWT_SECRET: ${BACKEND_JWT_SECRET}
      # El código lee CORS_ORIGINS (plural, separado por comas), no CORS_ORIGIN.
      # Con el nombre equivocado el panel se quedaba sin CORS (origin:false).
      CORS_ORIGINS: ${BACKEND_CORS_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      # Firmware (G-B): binarios en el volumen diana_firmware; la URL de descarga
      # debe ser la dirección del backend en la RED LOCAL (la usa el módulo en la OTA).
      FIRMWARE_DIR: ${FIRMWARE_DIR:-/app/firmware}
      FIRMWARE_PUBLIC_BASE_URL: ${FIRMWARE_PUBLIC_BASE_URL:-http://localhost:8080}
      TZ: UTC
    volumes:
      - diana_exports:/app/exports
      - diana_firmware:/app/firmware
      # Solo el certificado PUBLICO de la CA (ca.key jamas sale de su carpeta).
      - ./infrastructure/mosquitto/certs/ca.crt:/app/certs/mqtt-ca.crt:ro
    networks:
      - edge
      - internal
    healthcheck:
      # ⚠ COORDINACIÓN PENDIENTE (WP-02): se asume un endpoint /health en el
      # backend NestJS (convención habitual, p.ej. @nestjs/terminus), puerto
      # BACKEND_PORT. No confirmado contra código real (server/backend está
      # vacío al escribir esto). WP-02 debe exponerlo tal cual o avisar si
      # cambia de ruta/puerto; verificar al integrar las ramas.
      # El backend tiene prefijo global /api (config.globalPrefix), así que la
      # sonda de vida real es /api/health, no /health (verificado en el código,
      # HealthController @Get() bajo /health + setGlobalPrefix('api')).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${BACKEND_PORT:-3000}/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # Worker (informes y tareas diferidas, proceso separado del backend)
  # ----------------------------------------------------------------------------
  worker:
    build:
      # Contexto en la RAÍZ del repo: la imagen necesita el esquema Prisma del
      # backend (ver server/worker/Dockerfile, hallazgo F-13).
      context: .
      dockerfile: server/worker/Dockerfile
    image: diana/worker:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      # SIN configuracion ni credenciales MQTT, a proposito (P0-2, celda 11).
      # El worker no es cliente MQTT: su package.json no declara `mqtt`, no hay
      # codigo MQTT en server/worker/src y su unico interlocutor TCP es
      # postgres (verificado sobre este arbol). Recibia sin embargo
      # MQTT_USERNAME/MQTT_PASSWORD del backend --- la credencial mas
      # privilegiada del broker, en un proceso que jamas la usa: superficie de
      # robo pura. Minimo privilegio: lo que no se consume, no se entrega.
      REPORTS_CRON: ${WORKER_REPORTS_CRON:-0 3 * * *}
      LOG_LEVEL: ${WORKER_LOG_LEVEL:-info}
      TZ: UTC
    volumes:
      - diana_exports:/app/exports
    networks:
      - internal
    healthcheck:
      # El worker (server/worker/src/main.ts) es un bucle sin servidor HTTP;
      # NO expone /health ni puerto 3100. `pgrep -f "node dist/main.js"` sólo
      # comprobaba que el PROCESO seguía vivo: con el motor de Prisma
      # equivocado (ver server/worker/Dockerfile, causa raíz F-13 bis) el
      # proceso seguía en pie mientras TODAS las tareas fallaban en bucle, y
      # el contenedor se declaraba `healthy` sin haber completado ni una.
      # Ahora se comprueba el heartbeat que main.ts escribe en cada vuelta
      # (ver server/worker/src/health.ts + healthcheck.ts): vivo Y sirviendo.
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # Migraciones (Prisma) — job de arranque, no un servicio persistente
  # ----------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: server/backend/Dockerfile
    image: diana/backend:local
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: UTC
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # PostgreSQL — NO expuesto al host
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diana}
      POSTGRES_USER: ${POSTGRES_USER:-diana_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/postgres/init.d:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "hba_file=/var/lib/postgresql/data/pg_hba.conf"]
    networks:
      - internal
    # Sin `ports:`: postgres no se publica al host, ni siquiera en dev
    # (compose.dev.yml usa un puerto de depuración explícito y documentado).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diana_app} -d ${POSTGRES_DB:-diana}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # Mosquitto — publica el puerto MQTT sobre TLS (8883) y, TODAVIA, el puerto
  # en claro (1883). El WebSocket (9001) queda interno.
  #
  # OJO con la frase que habia aqui: decia que el 1883 «lo necesitan los modulos
  # ESP32 fisicos de la LAN». Eso sigue siendo cierto Y ES EL PROBLEMA: el
  # firmware vigente lleva `mqtt://%s:1883` CABLEADO y no puede usar el 8883.
  # Por eso el 1883 sobrevive a este porte, marcado como perfil de transicion.
  # Su retirada es el paso 16 y depende de la decision D1 del operador.
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    restart: unless-stopped
    ports:
      # Camino recomendado: MQTT sobre TLS.
      - "${MQTT_TLS_PORT:-8883}:8883"
      # PERFIL DE TRANSICION, con fecha de muerte. El 1883 en claro es el camino
      # por el que se leian credenciales de la LAN (hallazgo H7-03): cualquiera
      # con acceso a la red lee el CONNECT y se lleva usuario y contrasena. Se
      # mantiene publicado UNICAMENTE porque el firmware fisico no sabe hablar
      # TLS todavia. Retirarlo es el paso 16 del orden de porteo y exige la
      # decision D1. Mientras viva, toda credencial que viaje por aqui debe
      # considerarse comprometida ante cualquiera con acceso a la LAN.
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/mosquitto/acl:/mosquitto/config/acl:ro
      - ./infrastructure/mosquitto/passwd:/mosquitto/config/passwd:ro
      # Material TLS generado por infrastructure/mosquitto/generate-certs.sh.
      # Se montan los TRES ficheros uno a uno, NO el directorio: montar la
      # carpeta entera meteria tambien `ca.key` dentro del contenedor si alguien
      # la dejase ahi, y quien tenga esa clave puede emitir un certificado de
      # servidor valido y suplantar al broker. La CA firma desde fuera.
      # Solo lectura: el broker no tiene por que reescribir su propia clave.
      - ./infrastructure/mosquitto/certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./infrastructure/mosquitto/certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./infrastructure/mosquitto/certs/server.key:/mosquitto/certs/server.key:ro
      - mosquitto_data:/mosquitto/data
    environment:
      MQTT_HEALTHCHECK_USERNAME: ${MQTT_HEALTHCHECK_USERNAME:-healthcheck}
      MQTT_HEALTHCHECK_PASSWORD: ${MQTT_HEALTHCHECK_PASSWORD}
      TZ: UTC
    networks:
      - internal
    healthcheck:
      # Requiere el usuario 'healthcheck' generado con
      # infrastructure/mosquitto/generate-users.sh (ver infrastructure/mosquitto/acl).
      # PUBLICA en _health/probe: un `mosquitto_sub -C 1 -W 3` se quedaba esperando
      # un mensaje que nadie emite y expiraba siempre («Timed out» → unhealthy),
      # aunque la conexión y la ACL funcionaran. Publicar prueba broker + auth +
      # permiso de escritura del usuario healthcheck sobre _health/probe.
      # Va por TLS contra `localhost` (nombre presente en el SAN del certificado)
      # validando la CA: asi el healthcheck comprueba tambien que el material TLS
      # sigue siendo valido, no solo que el broker acepta credenciales. Sondear el
      # 1883 aqui dejaria el healthcheck en verde con el TLS roto.
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt -u \"$$MQTT_HEALTHCHECK_USERNAME\" -P \"$$MQTT_HEALTHCHECK_PASSWORD\" -t _health/probe -m ping -i healthcheck_probe || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # Backup — pg_dump programado, sin puertos publicados
  # ----------------------------------------------------------------------------
  backup:
    image: postgres:16.4-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/entrypoints/cron-loop-entrypoint.sh"]
    environment:
      CRON_SCHEDULE: ${BACKUP_CRON:-30 2 * * *}
      CRON_COMMAND: "/scripts/backup.sh"
      RUN_ON_START: "0"
      PGHOST: ${POSTGRES_HOST:-postgres}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGUSER: ${POSTGRES_USER:-diana_app}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-diana}
      BACKUP_ROOT: /backups
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-6}
      TZ: UTC
    volumes:
      - diana_backups:/backups
      - ./infrastructure/backups/backup.sh:/scripts/backup.sh:ro
      - ./infrastructure/backups/restore.sh:/scripts/restore.sh:ro
      - ./infrastructure/docker/cron-loop-entrypoint.sh:/entrypoints/cron-loop-entrypoint.sh:ro
    networks:
      - internal
    healthcheck:
      # El proceso es un bucle en primer plano; comprobamos que sigue vivo.
      test: ["CMD-SHELL", "pgrep -f cron-loop-entrypoint.sh || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # Simulador de módulos — perfil `simulator` (WP-05, simulators/target-module)
  # ----------------------------------------------------------------------------
  device-simulator:
    profiles: ["simulator"]
    build:
      # El Dockerfile del simulador exige contexto en la raíz del repo (necesita
      # contracts/ para autovalidarse). VERIFICADO/CORREGIDO por WP-08.
      context: .
      dockerfile: simulators/target-module/Dockerfile
    image: diana/device-simulator:local
    restart: "no"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      # MQTT_HOST/MQTT_PORT retiradas (P0-2): el simulador NO las lee. Su
      # entrypoint es `node dist/cli.js` y el broker se elige exclusivamente con
      # `--broker`; estas dos variables llevaban aqui desde el principio sin que
      # nadie las consultara, apuntando ademas al 1883 en claro. Es el mismo
      # defecto que tenia el backend --- configuracion que el despliegue pasa y
      # el proceso ignora --- y enganaba igual. Verificado sobre este arbol:
      # simulators/src/cli.ts y simulators/src/live.ts no leen ninguna de las
      # dos (live.ts usa el prefijo DIANA_MQTT_*).
      #
      # Para lanzarlo contra el broker real, desde el host de la VM:
      #   npx diana-sim run --broker mqtts://mosquitto:8883 \
      #     --cafile /workspace/certs/ca.crt --username module-01 --password ***
      SIMULATOR_MODULE_COUNT: ${SIMULATOR_MODULE_COUNT:-3}
      SIMULATOR_SEED: ${SIMULATOR_SEED:-42}
      SIMULATOR_MODULE_PREFIX: ${SIMULATOR_MODULE_PREFIX:-sim}
      TZ: UTC
    volumes:
      # Solo la CA publica, en solo lectura: es lo unico que necesita para
      # validar al broker. Ni la clave de la CA ni el certificado del servidor
      # tienen nada que hacer aqui. Sin este montaje, `--cafile` no tendria
      # ninguna ruta valida que senalar dentro del contenedor.
      - ./infrastructure/mosquitto/certs/ca.crt:/workspace/certs/ca.crt:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # Datos de prueba — perfil `dev` (siembra la base tras `migrate`)
  # ----------------------------------------------------------------------------
  seed:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: server/backend/Dockerfile
    image: diana/backend:local
    # Asume un script `db:seed` en server/backend/package.json (convención
    # Prisma habitual). WP-02 debe proveerlo o este comando se ajustará.
    command: ["npm", "run", "db:seed"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      TZ: UTC
    networks:
      - internal
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # Perfil `test` — base de datos y broker efímeros + ejecución de pruebas
  # ----------------------------------------------------------------------------
  postgres-test:
    profiles: ["test"]
    image: postgres:16.4-alpine
    restart: "no"
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_DB: diana_test
      POSTGRES_USER: diana_test
      POSTGRES_PASSWORD: diana_test
      TZ: UTC
      PGTZ: UTC
    networks:
      - testnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diana_test -d diana_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging

  mosquitto-test:
    profiles: ["test"]
    image: eclipse-mosquitto:2.0.18
    restart: "no"
    tmpfs:
      - /mosquitto/data
    volumes:
      - ./infrastructure/mosquitto/mosquitto.test.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - testnet
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 -i healthcheck_probe || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging

  test-runner:
    profiles: ["test"]
    image: python:3.12-slim
    restart: "no"
    working_dir: /workspace
    depends_on:
      postgres-test:
        condition: service_healthy
      mosquitto-test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://diana_test:diana_test@postgres-test:5432/diana_test
      MQTT_HOST: mosquitto-test
      MQTT_PORT: 1883
      TZ: UTC
    volumes:
      - ./:/workspace:ro
    command: ["sh", "-c", "pip install --quiet --no-cache-dir jsonschema referencing && python3 contracts/validate.py"]
    networks:
      - testnet
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # Monitorización ligera — perfil `monitoring` (opcional, ver
  # infrastructure/monitoring/README.md)
  # ----------------------------------------------------------------------------
  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    ports:
      - "${MONITORING_HTTP_PORT:-9090}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging

networks:
  # Red del perfil `test`, DELIBERADAMENTE SEPARADA. El broker efimero de
  # pruebas (mosquitto-test) escucha en claro a proposito, y mientras compartio
  # la red `internal` ofrecia a cualquier contenedor de produccion un camino
  # MQTT sin cifrar en cuanto se activaba el perfil. Un broker en claro solo es
  # aceptable si esta aislado de verdad, no si esta «solo para tests» por
  # convencion. No conectar servicios productivos a esta red.
  testnet:
    driver: bridge
  # Red de borde: proxy <-> frontend/backend. El proxy es el único servicio
  # con puertos publicados al host (además de mosquitto:1883).
  edge:
    driver: bridge
  # Red interna: backend/worker/migrate/backup <-> postgres/mosquitto. Ningún
  # servicio de esta red publica puertos al host salvo mosquitto, que publica
  # 8883 (TLS) y todavia 1883 (en claro, perfil de transicion para el firmware
  # fisico). NO escribir aqui «no queda ningun camino en claro»: hoy quedan dos
  # --- el 1883 y el 9001 de WebSockets, que sigue sin cifrar dentro de esta
  # red. La afirmacion cierta tras este porte es que el camino RECOMENDADO y el
  # que usa el backend van por TLS.
  internal:
    driver: bridge

volumes:
  postgres_data:
    name: diana_postgres_data
  mosquitto_data:
    name: diana_mosquitto_data
  diana_backups:
    name: diana_backups
  proxy_certs:
    name: diana_proxy_certs
  diana_exports:
    name: diana_exports
  diana_firmware:
    name: diana_firmware
