name: E2E

# End-to-end. Dos frentes:
#   1) frontend-mock: el panel contra su adaptador MOCK con Playwright (sin
#      backend). Es rápido y no necesita el stack.
#   2) stack-e2e-scaffold: el stack COMPLETO con Docker Compose + el simulador
#      de módulos. Los 16 escenarios del encargo (§19) viven en tests/e2e y hoy
#      son ANDAMIAJE: los 16 son `test.fixme`, medidos con
#      scripts/ci/e2e-scaffold-audit.sh. Se ejecutan CERO aserciones.
#      El job se llamaba "Stack completo (Compose) + 16 escenarios" y su paso
#      "Ejecutar los 16 escenarios": levantaba Postgres, Mosquitto, backend,
#      worker y simulador, no comprobaba nada y salía verde. Ese nombre
#      prometía una cobertura inexistente; ahora dice lo que hay. Implementar
#      los escenarios de verdad es la Ola 3 (Postgres y Mosquitto reales).
#
# Se lanza a mano o de madrugada, no en cada push: el stack completo es lento.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Panel contra el adaptador MOCK. Playwright con Chromium y las librerías de
  # sistema (--with-deps), que es justo lo que falta en el entorno de
  # desarrollo (hallazgo X-07): aquí el binario arranca de verdad.
  # ---------------------------------------------------------------------------
  frontend-mock:
    name: Panel (mock) con Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - run: npm ci
      - name: Instalar Chromium + librerías de sistema
        run: npx playwright install --with-deps chromium
      - name: Build de producción (lo que sirve `vite preview`)
        run: npm run build
      - name: E2E de panel (mock)
        run: npm run e2e
      - name: Publicar informe si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-frontend
          path: |
            server/frontend/playwright-report/
            server/frontend/test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Stack completo con Compose + simulador. Levanta postgres, mosquitto,
  # backend, worker, migrate y el simulador, y ejecuta la suite de tests/e2e.
  # ANDAMIAJE: la suite no contiene hoy ninguna aserción (16/16 `test.fixme`).
  # Lo que este job demuestra de verdad es que el STACK LEVANTA; no demuestra
  # ninguna cobertura funcional E2E. El paso de auditoría de abajo lo mide y
  # falla si el nombre del job deja de corresponder con los hechos.
  # ---------------------------------------------------------------------------
  stack-e2e-scaffold:
    name: "Stack completo (Compose) · E2E ANDAMIAJE — 0 escenarios ejecutados, 16 test.fixme"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Auditar el andamiaje E2E (falla si el nombre del job ya no es cierto)"
        run: bash scripts/ci/e2e-scaffold-audit.sh

      - name: Preparar .env
        run: |
          cp .env.example .env
          # Semillas deterministas para el runner; NO son secretos de producción.
          sed -i 's/CAMBIAR/ci-not-a-secret/g' .env

      # FALSO VERDE CORREGIDO: este paso llevaba `|| true` y sólo pedía 2 de las
      # 11 identidades declaradas. `generate-users.sh` necesita `mosquitto_passwd`,
      # que el runner NO trae; sin él sale con rc=2 y remite a `docker compose
      # exec mosquitto`, imposible aquí porque el stack aún no está construido.
      # Es decir: el paso fallaba SIEMPRE, el `|| true` se lo tragaba y el stack
      # arrancaba sin credenciales. Ahora se instala la herramienta, se generan
      # las 11 identidades de la fuente única con `--all` y el rc no se oculta.
      - name: Instalar mosquitto_passwd (lo necesita generate-users.sh)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto-clients
          command -v mosquitto_passwd

      - name: Generar las credenciales de Mosquitto de la fuente única
        run: ./infrastructure/mosquitto/generate-users.sh --all

      - name: Construir imágenes
        run: docker compose build

      - name: Levantar dependencias y aplicar migraciones
        run: |
          docker compose up -d postgres mosquitto
          docker compose up --exit-code-from migrate migrate
          docker compose up -d backend worker

      - name: Esperar salud del stack
        run: |
          for i in $(seq 1 30); do
            if docker compose ps --format '{{.Service}} {{.Health}}' | grep -q 'backend healthy'; then
              echo "Backend saludable."; break
            fi
            sleep 3
          done
          docker compose ps

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      # FALSO VERDE CORREGIDO: era `npm ci || npm install`. tests/e2e SÍ tiene
      # package-lock.json, así que el fallback sólo servía para que un lock
      # desincronizado pasara inadvertido: `npm ci` fallaba, `npm install`
      # reescribía el lock y el job seguía verde. Sin fallback, la deriva sale.
      - name: Instalar suite E2E de escenarios
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: "Ejecutar la suite E2E (hoy 0 aserciones: los 16 son test.fixme)"
        working-directory: tests/e2e
        env:
          DIANA_BASE_URL: http://localhost:8080
          MQTT_URL: mqtt://localhost:1883
        run: npm test

      - name: Logs del stack si algo falla
        if: failure()
        run: docker compose logs --no-color --tail 200 || true

      - name: Publicar informe E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stack
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore

      - name: Derribar el stack
        if: always()
        run: docker compose down -v
