# ==============================================================================
# Diana · broker EFÍMERO del carril E2E-2 (offline/recovery). NO es producción.
# ==============================================================================
# Anónimo y sin ACL A PROPÓSITO: este broker vive en un contenedor efímero, sin
# persistencia, y sólo lo usan las pruebas de este directorio. Lo que aquí se
# mide es el ciclo LWT → offline → reconexión → recuperación, NO la
# autorización (eso lo cubren infrastructure/mosquitto/test-acl*.sh).
#
# CONSECUENCIA DECLARADA: este escenario NO atraviesa
# infrastructure/mosquitto/set-coordinator.sh ni la ACL de producción, así que
# no puede reproducir la decisión D6 (ACL a 0600 → broker `Exited (13)`).
# ==============================================================================
persistence false

log_dest stdout
log_type warning
log_type error
log_type notice

allow_anonymous true

listener 1883
protocol mqtt
