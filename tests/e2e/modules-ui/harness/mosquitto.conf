# ==============================================================================
# Diana · E2E · MODULES-UI — configuración del broker EFÍMERO del escenario
# ==============================================================================
# NO es infrastructure/mosquitto/mosquitto.conf y no lo sustituye: es la copia
# mínima que necesita este escenario, y vive aquí porque tests/e2e/modules-ui/** es
# lo único que este carril posee.
#
# Lo que se conserva de producción, porque es lo que hace REAL la prueba:
#   allow_anonymous false      → hay autenticación de verdad
#   password_file              → contraseñas de verdad (las genera up.sh)
#   acl_file                   → la ACL REAL del repo, montada tal cual y en
#                                solo lectura (infrastructure/mosquitto/acl)
#   use_username_as_clientid   → la barrera F-02
#   listener 8883 + TLS        → el camino recomendado, el que usa el backend
#
# Lo que NO está: el listener 1883 en claro y el 9001 de WebSockets. El
# escenario no los necesita y publicarlos sólo abriría caminos que la prueba
# no ejerce.
# ==============================================================================
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true

allow_anonymous false
# Mismo sitio que en producción: un DIRECTORIO compartido con el backend, no un
# fichero suelto. `mosquitto_passwd` renombra encima, y un bind de fichero ata
# el contenedor al inodo viejo — el broker no vería ni una credencial nueva.
password_file /mosquitto/credentials/passwd
acl_file /mosquitto/config/acl
use_username_as_clientid true

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.2
socket_domain ipv4
