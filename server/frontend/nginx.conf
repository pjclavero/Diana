# Servidor estático para la SPA del panel Diana.
# Se ejecuta sin privilegios (imagen nginx-unprivileged, puerto 8080).
# El proxy inverso de infrastructure/** (WP-01) es responsable de exponer
# TLS y de enrutar /api y /ws hacia el backend; este servidor sólo sirve
# el build estático y hace fallback a index.html (rutas de React Router).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
